<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Поезд по УрГУПСу</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ea;--card:#fff;--ink:#1d2433;--mut:#5d6677;--acc:#c8102e;--blue:#1f4e8c;--ok:#1a8a4a;--bad:#c0392b;--line:#e3ddd0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141922;--card:#1e2530;--ink:#eef1f6;--mut:#a0a9b8;--acc:#ff5a6e;--blue:#6fa3ea;--ok:#4cc27f;--bad:#ff7b6b;--line:#2d3644}}
:root[data-theme="dark"]{--bg:#141922;--card:#1e2530;--ink:#eef1f6;--mut:#a0a9b8;--acc:#ff5a6e;--blue:#6fa3ea;--ok:#4cc27f;--bad:#ff7b6b;--line:#2d3644}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:520px;margin:0 auto;padding:14px 16px 40px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.top b{color:var(--acc)}
.lg{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.lg button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px;border-radius:18px;font:inherit;font-size:13px;cursor:pointer}
.lg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.track{position:relative;height:8px;background:var(--line);border-radius:4px;margin:26px 0 16px}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:4px;transition:width .4s}
.track span{position:absolute;top:-22px;font-size:20px;transform:translateX(-50%);transition:left .4s}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:21px;margin:0 0 6px}h3{font-size:16px;margin:16px 0 4px}
.mut{color:var(--mut);font-size:14px}.big{font-size:44px;line-height:1}
button.b{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
button.b:disabled{cursor:default}
button.b.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
button.b.no{border-color:var(--bad);opacity:.6}
button.p{display:block;width:100%;background:var(--acc);color:#fff;border:0;border-radius:18px;padding:13px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}
.msg{margin:10px 0;font-weight:600}.msg.g{color:var(--ok)}.msg.r{color:var(--bad)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.ph button{position:relative;flex:none;display:grid;place-items:center;width:52px;height:52px;margin:-6px -4px -6px 0;border:0;border-radius:18px;background:color-mix(in srgb,var(--blue) 12%,transparent);font-size:24px;line-height:1;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .08s,background .15s}
.ph button::after{content:"";position:absolute;inset:-6px}
.ph button:active{transform:scale(.9);background:color-mix(in srgb,var(--blue) 30%,transparent)}
pre{white-space:pre-wrap;font:inherit;margin:4px 0}
.mapimg{width:100%;display:block;border-radius:12px;border:1px solid var(--line);margin-top:8px}
.ln{font-weight:600}
.ln i{font-style:normal;font-size:11px;font-weight:700;background:var(--line);color:var(--mut);border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.route{position:relative;display:flex;gap:4px;margin:34px 0 12px}
.seg{position:relative;flex:1;height:10px;border-radius:5px;background:color-mix(in srgb,var(--sc) 22%,var(--line))}
.seg i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--sc);transition:width .6s}
.seg b{position:absolute;left:-2px;top:-3px;width:16px;height:16px;border-radius:50%;background:var(--card);border:3px solid var(--sc)}
.tr{position:absolute;top:-32px;font-size:24px;transform:translateX(-50%);transition:left .8s cubic-bezier(.4,.1,.2,1);animation:bob 1s ease-in-out infinite}
.plate{display:flex;align-items:center;gap:12px;background:var(--sc);color:#fff;border-radius:14px 14px 0 0;padding:10px 14px;border-bottom:5px solid rgba(0,0,0,.28)}
.pn{flex:none;width:38px;height:38px;border-radius:50%;background:#fff;color:var(--sc);font-weight:800;font-size:20px;display:grid;place-items:center}
.ps{font-size:12px;opacity:.92}.pt{font-size:19px;font-weight:700;line-height:1.2}
.plate+.card{border-radius:0 0 16px 16px;border-top:0;border-color:var(--sc)}
.plate.enter{animation:drop .5s}
#app.out{animation:outL .16s ease-in forwards}#app.outb{animation:outR .16s ease-in forwards}
#app.in{animation:inL .3s ease-out}#app.inb{animation:inR .3s ease-out}
.w{overflow-x:clip}
.b.ok.pop{animation:pop .45s}.b.no.shake{animation:shake .4s}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.cf i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall 1.4s ease-in forwards}
@keyframes bob{50%{margin-top:-3px}}
@keyframes drop{from{transform:translateY(-16px);opacity:0}}
@keyframes outL{to{opacity:0;transform:translateX(-28px)}}
@keyframes outR{to{opacity:0;transform:translateX(28px)}}
@keyframes inL{from{opacity:0;transform:translateX(28px)}}
@keyframes inR{from{opacity:0;transform:translateX(-28px)}}
@keyframes pop{40%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
input{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:inherit;margin:6px 0 10px}
.chip{display:inline-block;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 12px;margin:4px 6px 4px 0;font:inherit;font-size:14px;cursor:pointer}
.chip.on{border-color:var(--sc,var(--blue));background:color-mix(in srgb,var(--sc,var(--blue)) 18%,var(--card));font-weight:600}
.steps{padding:0;margin:8px 0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;margin:9px 0}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--sc,var(--blue));color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;color:var(--ink);opacity:.085}
.w{position:relative;z-index:1}
#bg2{position:fixed;right:6px;bottom:8px;width:84px;height:auto;z-index:0;pointer-events:none;color:var(--ink);transform:rotate(-6deg)}
#bg2 .k{fill:var(--bg)}

var MAIL="Здравствуйте, [Имя Отчество]!\nМеня зовут [Имя], я студент(ка) группы [группа], приехал(а) из [страна].\nЯ не смог(ла) прийти на занятие [дата]: [причина].\nПодскажите, пожалуйста, как можно отработать пропущенное?\nС уважением,\n[Имя Фамилия]",

[["Здравствуйте, я студент УрГУПС.","Hello, I am a USURT student."],["Подскажите, пожалуйста, как пройти в деканат?","Could you tell me how to get to the dean’s office?"],["Где находится международный отдел?","Where is the International Office?"]],
[["Здравствуйте, [Имя Отчество]!","Hello, [first name and patronymic]!"],["Извините, я не понял(а). Повторите, пожалуйста.","Sorry, I didn’t understand. Please repeat."],["Можно задать вопрос?","May I ask a question?"],["Спасибо большое!","Thank you very much!"]],

ru:{t:"Поезд по УрГУПСу",sub:"Карманный квест для новых студентов",intro:"Поезд отправляется! Проедь 7 станций, разберись в студенческих словах и научись общаться с преподавателями и студентами УрГУПС. Всё нужное останется у тебя в кармане.",go:"Сесть в поезд 🚂",st:"Станция",of:"из",sc:"Баллы",ok:"Верно! +",pt:" баллов",no:"Не совсем. Нажми «Перезапустить вопрос»: варианты перемешаются.",rs:"🔄 Перезапустить вопрос",next:"Дальше →",pb:"📖 Разговорник",back:"← Назад",fin:"Финиш 🏁",dn:"Конечная! Ты прошёл квест",rw:"Теперь ты знаешь, куда идти и что сказать. Все фразы сохранены в разговорнике.",cp:"Копировать",cpd:"Скопировано ✓",re:"Пройти заново",say:"Фразы в карман",ml:"Шаблон письма",gl:"Слова студента",mp:"Схема студенческого городка: КПП № 1 сверху (у стадиона спорткомплекса УрГУПС), КПП № 2 слева внизу, у воды",k1:"КПП 1",k2:"КПП 2",sk:"Спорткомплекс УрГУПС",
S:[
{i:"🚪",n:"Вход в кампус",x:"В студенческий городок ведут два входа — КПП 1 и КПП 2. КПП 1 находится у дороги, рядом со стадионом спорткомплекса УрГУПС. КПП 2 находится у воды. Смотри карту ниже. Пропуск или студенческий держи под рукой.",map:1,q:"Охранник у входа спрашивает, куда ты идёшь. Что лучше сказать?",o:["Никуда","Здравствуйте, я студент УрГУПС, иду в деканат","Эй, пропустите!"],c:1,e:"Вежливо и по делу — так проще всего."},
{i:"👨‍🏫",n:"Общение с преподавателем",x:"К преподавателю в России обращаются на «вы», по имени и отчеству, например «Иван Петрович». Не понял — это нормально, попроси повторить.",q:"Как поприветствовать преподавателя?",o:["Привет, Иван!","Эй, преподаватель!","Здравствуйте, Иван Петрович!"],c:2,e:"Имя и отчество — знак уважения."},
{i:"✉️",n:"Письмо преподавателю",x:"Пропустил занятие или нужна помощь? Напиши коротко и вежливо: кто ты, из какой группы, что случилось и о чём просишь. Ниже готовый шаблон: скопируй и подставь свои данные.",mail:1,q:"Что обязательно указать в письме?",o:["Только «Помогите»","Имя, группу и суть просьбы","Ничего, преподаватель поймёт"],c:1,e:"Так преподаватель сразу поймёт, кто ты и чем помочь."},
{i:"🗣️",n:"Знакомство с одногруппниками",x:"Не бойся заговорить первым: многие студенты рады знакомству. Попроси старосту добавить тебя в чат группы: там делятся расписанием и заданиями.",q:"Как начать разговор с одногруппником?",o:["Привет! Меня зовут …, а тебя?","Молча сесть рядом","Спросить, сколько он зарабатывает"],c:0,e:"Простое «меня зовут… а тебя?» — лучшее начало."},
{i:"🏠",n:"Общежитие и быт",x:"В общежитии есть правила и тихие часы. Если что-то сломалось или нужна помощь — к коменданту. Предупреждай соседей, если ждёшь гостей или шумишь допоздна.",q:"В комнате не работает отопление. Что сказать коменданту?",o:["Холодно, сделайте что-нибудь!","Здравствуйте, в комнате 214 не работает отопление. Можно посмотреть?","Ничего, потерплю"],c:1,e:"Назови комнату и проблему — помогут быстрее."},
{i:"🆘",n:"Куда обратиться за помощью",x:"Виза и документы — международный отдел. Расписание, справки об обучении и учебные вопросы — деканат. Профком — это студенческий профсоюз: он защищает права студентов и организует мероприятия. О материальной помощи можно спросить в деканате или в профкоме. Книги — библиотека. Не стесняйся спрашивать!",q:"У тебя вопрос по визе и регистрации. Куда идти?",o:["В спортивный комплекс","В библиотеку","В международный отдел"],c:2,e:"Виза и регистрация — международный отдел."},
{i:"🏃",n:"Спорт и друзья",x:"Спорткомплекс УрГУПС — это стадион и спортивные залы на территории городка (на карте на первой станции он подписан «СК УрГУПС»). Секции — лучший способ найти друзей вне пар.",q:"Как познакомиться с людьми вне учёбы?",o:["Записаться в секцию или клуб","Сидеть в комнате","Ждать, пока подойдут"],c:0,e:"Общие занятия сближают."}]},
en:{t:"All Aboard: USURT",sub:"A pocket quest for new students",intro:"All aboard! Ride 7 stations and learn to talk with teachers and students at USURT. The phrases from every station stay in your pocket.",go:"Board the train 🚂",st:"Station",of:"of",sc:"Points",ok:"Correct! +",pt:" points",no:"Not quite. Press “Restart question”: the options will be shuffled.",rs:"🔄 Restart question",next:"Next →",pb:"📖 Phrasebook",back:"← Back",fin:"Finish 🏁",dn:"Final stop! Quest complete",rw:"Now you know where to go and what to say. All phrases are saved in your phrasebook.",cp:"Copy",cpd:"Copied ✓",re:"Start over",say:"Phrases for your pocket",ml:"Email template",gl:"Student words",mp:"Campus map: Checkpoint 1 at the top (next to the USURT stadium), Checkpoint 2 at the bottom left, by the water",k1:"Checkpoint 1",k2:"Checkpoint 2",sk:"USURT sports complex",
S:[
{i:"🚪",n:"Campus entrance",x:"There are two entrances to the student campus: Checkpoint 1 and Checkpoint 2. Checkpoint 1 is by the road, next to the USURT stadium. Checkpoint 2 is by the water. See the map below. Keep your pass or student card handy.",map:1,q:"The guard at the entrance asks where you are going. What is best to say?",o:["Nowhere","Здравствуйте, я студент УрГУПС, иду в деканат (Hello, I’m a student, going to the dean’s office)","Hey, let me in!"],c:1,e:"Polite and to the point works best."},
{i:"👨‍🏫",n:"Talking to teachers",x:"In Russia teachers are addressed formally (“вы”) by first name and patronymic, for example “Ivan Petrovich”. If you didn’t understand, that’s fine: ask them to repeat.",q:"How do you greet a teacher?",o:["Hi, Ivan!","Hey, teacher!","Здравствуйте, Иван Петрович! (Hello, Ivan Petrovich!)"],c:2,e:"First name and patronymic show respect."},
{i:"✉️",n:"Email to a teacher",x:"Missed a class or need help? Write a short, polite email: who you are, your group, what happened and what you ask. Below is a ready template: copy it and fill in your details.",mail:1,q:"What must be in the email?",o:["Just “Help”","Your name, group and what you ask","Nothing, the teacher will figure it out"],c:1,e:"Then the teacher quickly understands who you are and how to help."},
{i:"🗣️",n:"Meeting classmates",x:"Don’t be afraid to speak first: many students are happy to meet you. Ask your group leader (староста) to add you to the group chat, where timetables and assignments are shared.",q:"How do you start a conversation with a classmate?",o:["Привет! Меня зовут …, а тебя? (Hi! My name is …, what’s yours?)","Sit silently next to them","Ask how much they earn"],c:0,e:"A simple “my name is… and yours?” is the best start."},
{i:"🏠",n:"Dorm life",x:"The dormitory has rules and quiet hours. If something breaks or you need help, go to the commandant. Warn roommates if you expect guests or will be noisy late.",q:"The heating in your room doesn’t work. What do you tell the commandant?",o:["It’s cold, do something!","Здравствуйте, в комнате 214 не работает отопление. Можно посмотреть? (Hello, the heating in room 214 isn’t working. Could you look?)","Nothing, I’ll put up with it"],c:1,e:"Name the room and the problem: you’ll get help faster."},
{i:"🆘",n:"Who to ask for help",x:"Visa and documents: International Office. Timetable, certificates and study questions: dean’s office. The “профком” is the student union: it protects students’ rights and organizes events. You can ask about financial help at the dean’s office or the student union. Books: library. Don’t be shy to ask!",q:"You have a question about your visa and registration. Where do you go?",o:["Sports complex","Library","International Office"],c:2,e:"Visa and registration go to the International Office."},
{i:"🏃",n:"Sports and friends",x:"The USURT sports complex and stadium are on campus (marked on the map at the first station). Clubs are the best way to make friends outside class.",q:"How can you meet people outside your studies?",o:["Join a club or sports section","Stay in your room","Wait for people to come to you"],c:0,e:"Shared activities bring people together."}]},

kk:{t:"Пойызға отыр: УрГУПС",sub:"Жаңа студенттерге арналған қалта квесті",intro:"Пойыз жолға шығады! 7 бекеттен өтіп, оқытушылармен және студенттермен сөйлесуді үйрен. Әр бекеттегі сөз тіркестері қалтаңда қалады.",go:"Пойызға отыру 🚂",st:"Бекет",of:"/",sc:"Ұпай",ok:"Дұрыс! +",pt:" ұпай",no:"Дәл емес. «Сұрақты қайта бастау» батырмасын бас: жауаптар араласады.",rs:"🔄 Сұрақты қайта бастау",next:"Әрі қарай →",pb:"📖 Қалта сөздігі",back:"← Артқа",fin:"Мәре 🏁",dn:"Соңғы бекет! Квесті аяқтадың",rw:"Енді қайда баруды және не айтуды білесің. Барлық сөз тіркестері қалта сөздігінде сақталған.",cp:"Көшіру",cpd:"Көшірілді ✓",re:"Қайтадан бастау",say:"Қалтаға пайдалы сөз тіркестері",ml:"Хат үлгісі",gl:"Студент сөздері",mp:"Кампус сызбасы: КПП № 1 жоғарыда (УрГУПС спорт кешенінің стадионы жанында), КПП № 2 сол жақ төменде, су жағасында",k1:"КПП 1",k2:"КПП 2",sk:"УрГУПС спорт кешені"}};

["进入校园","学生城有两个入口：1号检查口和2号检查口。1号检查口在马路旁，挨着УрГУПС体育场。2号检查口在水边。请看下面的地图。请随身带好通行证或学生证。","门口的保安问你要去哪里，说什么最合适？",["哪儿也不去","Здравствуйте, я студент УрГУПС, иду в деканат（您好，我是学生，去院系办公室）","喂，让我进去！"],"礼貌、简明，最有效。"],
["和老师交流","在俄罗斯，学生对老师要用敬称“вы”，并称呼名字和父称，例如“Иван Петрович”。没听懂也没关系，请老师再说一遍。","怎样问候老师？",["嗨，伊万！","喂，老师！","Здравствуйте, Иван Петрович!（您好，伊万·彼得罗维奇！）"],"称呼名字和父称表示尊重。"],
["给老师写邮件","缺课或需要帮助？写一封简短礼貌的邮件：你是谁、哪个班、发生了什么、你的请求。下面有现成模板，复制后填上你的信息。","邮件里必须写什么？",["只写“帮帮我”","姓名、班级和请求内容","什么都不写，老师会明白"],"这样老师能很快知道你是谁、该如何帮你。"],
["认识同学","别怕先开口：很多同学乐于结识你。请班长（староста）把你拉进班级群，课表和作业都在那里分享。","怎样和同学开始聊天？",["Привет! Меня зовут …, а тебя?（你好！我叫……，你呢？）","默默坐在旁边","问对方挣多少钱"],"简单的“我叫……，你呢？”是最好的开场。"],
["宿舍生活","宿舍有规定和安静时间。东西坏了或需要帮助，请找宿舍管理员（комендант）。如果有客人来或要晚睡吵闹，请提前告诉室友。","房间暖气坏了，怎么对宿管说？",["好冷，你们想想办法！","Здравствуйте, в комнате 214 не работает отопление. Можно посмотреть?（您好，214房间暖气坏了，能来看看吗？）","没事，我忍一忍"],"说清房间号和问题，会更快得到帮助。"],
["遇到问题找谁","签证和证件：国际部。课表、证明和学习问题：院系办公室。“профком”是学生工会：它维护学生权益并组织活动。关于经济资助，可以问院系办公室或学生工会。借书：图书馆。别不好意思开口问！","你有关于签证和注册的问题，该去哪里？",["体育综合馆","图书馆","国际部"],"签证和注册找国际部。"],

fr:{S:[
["Entrée du campus","Il y a deux entrées pour le campus étudiant : le poste 1 et le poste 2. Le poste 1 est près de la route, à côté du stade de l’UrGUPS. Le poste 2 est au bord de l’eau. Regarde le plan ci-dessous. Garde ton badge ou ta carte d’étudiant à portée de main.","Le garde à l’entrée te demande où tu vas. Que dire ?",["Nulle part","Здравствуйте, я студент УрГУПС, иду в деканат (Bonjour, je suis étudiant, je vais au secrétariat)","Eh, laissez-moi passer !"],"Poli et direct : c’est le plus efficace."],
["Parler aux professeurs","En Russie, on s’adresse aux professeurs avec « вы » et par prénom et patronyme, par exemple « Ivan Petrovitch ». Si tu n’as pas compris, ce n’est pas grave : demande de répéter.","Comment saluer un professeur ?",["Salut, Ivan !","Eh, prof !","Здравствуйте, Иван Петрович ! (Bonjour, Ivan Petrovitch !)"],"Prénom et patronyme montrent du respect."],
["Écrire à un professeur","Tu as manqué un cours ou besoin d’aide ? Écris un message court et poli : qui tu es, ton groupe, ce qui s’est passé et ta demande. Voici un modèle : copie-le et complète-le.","Que faut-il indiquer dans le message ?",["Juste « Aidez-moi »","Ton nom, ton groupe et ta demande","Rien, le professeur comprendra"],"Ainsi le professeur comprend vite qui tu es et comment t’aider."],
["Rencontrer ses camarades","N’aie pas peur de parler le premier : beaucoup d’étudiants seront heureux de te rencontrer. Demande au délégué (староста) de t’ajouter au groupe de discussion, où l’on partage emploi du temps et devoirs.","Comment engager la conversation avec un camarade ?",["Привет! Меня зовут …, а тебя? (Salut ! Je m’appelle …, et toi ?)","S’asseoir en silence à côté de lui","Lui demander combien il gagne"],"Un simple « je m’appelle… et toi ? » est le meilleur début."],
["Vie en résidence","La résidence a un règlement et des heures de silence. Si quelque chose casse ou si tu as besoin d’aide, va voir le gestionnaire (комендант). Préviens tes colocataires si tu attends des invités ou fais du bruit tard.","Le chauffage de ta chambre ne marche pas. Que dis-tu au gestionnaire ?",["Il fait froid, faites quelque chose !","Здравствуйте, в комнате 214 не работает отопление. Можно посмотреть? (Bonjour, le chauffage de la chambre 214 ne marche pas. Pouvez-vous regarder ?)","Rien, je vais supporter"],"Donne le numéro de chambre et le problème : on t’aidera plus vite."],
["Qui demander de l’aide","Visa et documents : service international. Emploi du temps, attestations et questions d’études : secrétariat de faculté. Le « профком » est le syndicat étudiant : il défend les droits des étudiants et organise des événements. Pour une aide financière, demande au secrétariat de faculté ou au syndicat. Livres : bibliothèque. N’hésite pas à demander !","Tu as une question sur ton visa et ton enregistrement. Où aller ?",["Complexe sportif","Bibliothèque","Service international"],"Visa et enregistrement : service international."],
["Sport et amis","Le complexe sportif et le stade de l’UrGUPS sont sur le campus (indiqués sur le plan de la première station). Les clubs sont le meilleur moyen de se faire des amis hors des cours.","Comment rencontrer des gens en dehors des études ?",["Rejoindre un club ou une section sportive","Rester dans sa chambre","Attendre que les gens viennent"],"Les activités communes rapprochent."]],
P:[["Bonjour, je suis étudiant à l’UrGUPS.","Pourriez-vous m’indiquer le chemin du secrétariat ?","Où se trouve le service international ?"],["Bonjour, [prénom et patronyme] !","Désolé, je n’ai pas compris. Répétez, s’il vous plaît.","Puis-je poser une question ?","Merci beaucoup !"],["Je m’appelle [nom], je suis étudiant(e) du groupe [groupe].","Comment puis-je rattraper le cours manqué ?","Cordialement, [nom]"],["Salut ! Je m’appelle [nom], et toi ?","Je viens de [pays]. Et toi ?","Je peux m’asseoir ici ?","On révise ensemble ?"],["Bonjour, dans la chambre [numéro], [quoi] ne marche pas.","Quand puis-je venir chercher la clé ?","Désolé pour le bruit, on fera moins de bruit."],["J’ai besoin d’aide.","Je suis étudiant international, dites-moi quoi faire.","À qui dois-je m’adresser pour cela ?"],["Je peux m’inscrire au club ?","Quand avez-vous entraînement ?","Jouons ensemble !"]],
G:[["poste de contrôle : l’endroit où l’on vérifie ton badge à l’entrée","badge : document ou carte qui permet d’entrer"],["période de cours à l’université, en général 1 h 30","contrôles de fin de semestre : зачёт = validé ou non, экзамен = note"],["travail de rattrapage pour un cours manqué","motif valable d’absence, comme la maladie (un certificat est souvent demandé)"],["le délégué qui fait le lien entre le groupe et le secrétariat","groupe d’étudiants qui étudient ensemble"],["la personne responsable de la résidence et des réparations","heures de silence : le bruit est interdit"],["bureau de la faculté : emploi du temps, attestations, documents","syndicat étudiant : défend les droits des étudiants et organise des événements"],["club sportif avec un entraîneur","complexe sportif"]],
M:"Bonjour, [prénom et patronyme] !\nJe m’appelle [nom], je suis étudiant(e) du groupe [groupe], de [pays].\nJe n’ai pas pu assister au cours du [date] : [raison].\nComment puis-je le rattraper ?\nCordialement,\n[nom]"},
kk:{S:[
["Кампусқа кіру","Студенттер қалашығына екі кіре беріс бар: КПП 1 және КПП 2. КПП 1 жолдың бойында, УрГУПС стадионының қасында. КПП 2 су жағасында. Төмендегі картаны қара. Рұқсатнама немесе студенттік билетті қолыңда ұста.","Кіреберістегі күзетші қайда бара жатқаныңды сұрады. Не айтқан дұрыс?",["Ешқайда","Здравствуйте, я студент УрГУПС, иду в деканат (Сәлеметсіз бе, мен студентпін, деканатқа барамын)","Әй, өткізіңдер!"],"Сыпайы әрі нақты айту — ең тиімдісі."],
["Оқытушымен сөйлесу","Ресейде оқытушыға «вы» деп, аты мен әкесінің атымен жүгінеді, мысалы «Иван Петрович». Түсінбесең — қорықпа, қайталауын сұра.","Оқытушымен қалай амандасады?",["Сәлем, Иван!","Әй, оқытушы!","Здравствуйте, Иван Петрович! (Сәлеметсіз бе, Иван Петрович!)"],"Аты мен әкесінің аты — құрметтің белгісі."],
["Оқытушыға хат жазу","Сабақты жіберіп алдың немесе көмек керек пе? Қысқа әрі сыпайы жаз: кімсің, қай топтансың, не болды және не сұрайсың. Төменде дайын үлгі бар: көшіріп, деректеріңді қой.","Хатта міндетті түрде не көрсетілуі керек?",["Тек «Көмектесіңіз»","Аты-жөнің, тобың және өтінішің","Ештеңе, оқытушы түсінеді"],"Сонда оқытушы кім екеніңді және қалай көмектесерін тез түсінеді."],
["Топтастармен танысу","Бірінші болып сөйлесуден қорықпа: көптеген студент танысуға қуанады. Старостадан сені топ чатына қосуын сұра: кесте мен тапсырмалар сонда бөлісіледі.","Топтасыңмен әңгімені қалай бастайсың?",["Привет! Меня зовут …, а тебя? (Сәлем! Менің атым …, ал сенікі?)","Үндемей қасына отыру","Қанша табатынын сұрау"],"Қарапайым «менің атым… ал сенікі?» — ең жақсы бастама."],
["Жатақхана өмірі","Жатақханада ережелер мен тыныштық уақыты бар. Бірдеңе бұзылса немесе көмек керек болса — комендантқа бар. Қонақ күтсең немесе кеш дыбыс шығарсаң, бөлмелестеріңе ескерт.","Бөлмеде жылу жұмыс істемейді. Комендантқа не дейсің?",["Суық, бірдеңе істеңіздер!","Здравствуйте, в комнате 214 не работает отопление. Можно посмотреть? (Сәлеметсіз бе, 214 бөлмеде жылу жұмыс істемейді. Қарап шығуға бола ма?)","Ештеңе, шыдай тұрамын"],"Бөлме нөмірі мен мәселені айт — тезірек көмектеседі."],
["Кімнен көмек сұрау керек","Виза және құжаттар — халықаралық бөлім. Кесте, анықтамалар және оқу мәселелері — деканат. «Профком» — студенттер кәсіподағы: ол студенттердің құқығын қорғайды және іс-шаралар ұйымдастырады. Материалдық көмек туралы деканаттан немесе профкомнан сұрауға болады. Кітаптар — кітапхана. Сұрауға ұялма!","Виза мен тіркеу бойынша сұрағың бар. Қайда барасың?",["Спорт кешеніне","Кітапханаға","Халықаралық бөлімге"],"Виза мен тіркеу — халықаралық бөлім."],
["Спорт және достар","УрГУПС спорт кешені — кампустағы стадион мен спорт залдары (бірінші бекеттегі картада «СК УрГУПС» деп белгіленген). Секциялар — оқудан тыс дос табудың ең жақсы жолы.","Оқудан тыс адамдармен қалай танысасың?",["Секцияға немесе клубқа жазылу","Бөлмеде отыру","Адамдар өздері келгенше күту"],"Ортақ іс адамдарды жақындатады."]],
P:[["Сәлеметсіз бе, мен УрГУПС студентімін.","Деканатқа қалай баруға болатынын айтып жіберіңізші?","Халықаралық бөлім қайда орналасқан?"],["Сәлеметсіз бе, [аты мен әкесінің аты]!","Кешіріңіз, түсінбедім. Қайталап беріңізші.","Сұрақ қоюға бола ма?","Көп рахмет!"],["Менің атым [аты], мен [топ] тобының студентімін.","Жіберіп алған сабақты қалай өтеуге болады?","Құрметпен, [аты-жөні]"],["Сәлем! Менің атым [аты], ал сенікі?","Мен [ел] елінденмін. Ал сен қайдансың?","Осында отыруға бола ма?","Бірге дайындалайық па?"],["Сәлеметсіз бе, [нөмір] бөлмеде [не] жұмыс істемейді.","Кілтті қашан алуға келуге болады?","Шу үшін кешіріңіз, тыныш боламыз."],["Маған көмек керек.","Мен шетелдік студентпін, не істеу керегін айтыңызшы.","Бұл мәселе бойынша кімге жүгінемін?"],["Секцияға жазылуға бола ма?","Жаттығулар қашан?","Бірге ойнайық!"]],
G:[["бақылау-өткізу пункті: кіреберісте рұқсатнаманы тексеретін жер","рұқсатнама: кіруге мүмкіндік беретін құжат немесе карта"],["пара: университеттегі бір сабақ, әдетте бір жарым сағат","семестр соңындағы тексеру: зачёт — «өтті/өтпеді», экзамен — баға қояды"],["өтеу: жіберілген сабақ үшін орындалатын тапсырма","дәлелді себеп: сабақ жіберудің маңызды себебі, мысалы ауру (көбіне анықтама керек)"],["староста: топ пен деканатты байланыстыратын студент","топ: бірге оқитын студенттер"],["комендант: жатақхана мен жөндеуге жауапты адам","тыныштық уақыты: шуылдауға болмайтын уақыт"],["деканат: факультет кеңсесі — кесте, анықтамалар, құжаттар","профком: студенттер кәсіподағы — студенттердің құқығын қорғайды және іс-шаралар ұйымдастырады"],["секция: жаттықтырушысы бар спорт тобы","спорт кешені"]],
M:"Сәлеметсіз бе, [аты мен әкесінің аты]!\nМенің атым [аты], мен [топ] тобының студентімін, [ел] елінденмін.\nМен [күні] сабаққа келе алмадым: [себеп].\nЖіберіп алғанымды қалай өтеуге болады?\nҚұрметпен,\n[аты-жөні]"}};
L.hi={t:"ट्रेन में सवार हो जाओ: УрГУПС",sub:"नए छात्रों के लिए पॉकेट क्वेस्ट",intro:"ट्रेन रवाना हो रही है! 7 स्टेशनों से गुज़रें और शिक्षकों व छात्रों से बात करना सीखें। हर स्टेशन के उपयोगी वाक्य आपकी जेब में रहेंगे।",go:"ट्रेन में चढ़ें 🚂",st:"स्टेशन",of:"/",sc:"अंक",ok:"सही! +",pt:" अंक",no:"सही नहीं। “प्रश्न दोबारा शुरू करें” दबाएँ: विकल्प नए क्रम में आएँगे।",rs:"🔄 प्रश्न दोबारा शुरू करें",next:"आगे →",pb:"📖 पॉकेट शब्दकोश",back:"← वापस",fin:"मंज़िल 🏁",dn:"आख़िरी स्टेशन! क्वेस्ट पूरा हुआ",rw:"अब आप जानते हैं कि कहाँ जाना है और क्या कहना है। सभी वाक्य आपके शब्दकोश में सुरक्षित हैं।",cp:"कॉपी करें",cpd:"कॉपी हो गया ✓",re:"फिर से शुरू करें",say:"आपकी जेब के लिए वाक्य",ml:"ईमेल का नमूना",gl:"छात्र शब्द",mp:"कैंपस का नक्शा: चेकपॉइंट 1 ऊपर (УрГУПС स्टेडियम के पास), चेकपॉइंट 2 नीचे बाईं ओर, पानी के किनारे"};
X.hi={S:[
["कैंपस में प्रवेश","छात्र-परिसर में जाने के दो प्रवेश-द्वार हैं: चेकपॉइंट 1 और चेकपॉइंट 2। चेकपॉइंट 1 सड़क के पास, УрГУПС स्टेडियम के बगल में है। चेकपॉइंट 2 पानी के किनारे है। नीचे नक्शा देखें। अपना पास या छात्र कार्ड हाथ में रखें।","गेट पर गार्ड पूछता है कि आप कहाँ जा रहे हैं। क्या कहना सबसे अच्छा है?",[],"विनम्र और सीधी बात सबसे अच्छी रहती है।"],
["शिक्षकों से बात करना","रूस में शिक्षकों को आदर से “вы” कहकर और नाम व पितृनाम (पिता के नाम) से बुलाया जाता है, जैसे “Иван Петрович”। कुछ समझ न आए तो कोई बात नहीं: दोबारा बोलने को कहें।","शिक्षक का अभिवादन कैसे करें?",[],"नाम और पितृनाम से बुलाना सम्मान दिखाता है।"],
["शिक्षक को ईमेल","कोई कक्षा छूट गई या मदद चाहिए? छोटा और विनम्र ईमेल लिखें: आप कौन हैं, किस समूह में हैं, क्या हुआ और आप क्या चाहते हैं। नीचे तैयार नमूना है: उसे कॉपी करके अपनी जानकारी भरें।","ईमेल में क्या ज़रूर होना चाहिए?",["सिर्फ़ “मदद करो”","नाम, समूह और आपका अनुरोध","कुछ नहीं, शिक्षक खुद समझ जाएँगे"],"तब शिक्षक जल्दी समझ जाते हैं कि आप कौन हैं और कैसे मदद करें।"],
["सहपाठियों से मिलना","पहले बात करने से न डरें: बहुत-से छात्र मिलकर खुश होते हैं। अपने समूह के староста (समूह-प्रमुख) से कहें कि आपको ग्रुप चैट में जोड़ दे: वहीं समय-सारणी और असाइनमेंट साझा होते हैं।","सहपाठी से बातचीत कैसे शुरू करें?",[],"“मेरा नाम… है, और आपका?” सबसे अच्छी शुरुआत है।"],
["हॉस्टल का जीवन","हॉस्टल में नियम और शांति के घंटे होते हैं। कुछ टूट जाए या मदद चाहिए तो комендант (हॉस्टल प्रबंधक) के पास जाएँ। मेहमान आने वाले हों या देर रात तक शोर होगा, तो रूममेट को पहले बता दें।","कमरे में हीटर काम नहीं कर रहा। प्रबंधक से क्या कहेंगे?",[],"कमरा नंबर और समस्या बताएँ: मदद जल्दी मिलेगी।"],
["मदद के लिए किससे पूछें","वीज़ा और दस्तावेज़: अंतरराष्ट्रीय विभाग। समय-सारणी, प्रमाण-पत्र और पढ़ाई के सवाल: डीन कार्यालय। “профком” छात्र संघ है: यह छात्रों के अधिकारों की रक्षा करता है और कार्यक्रम आयोजित करता है। आर्थिक मदद के बारे में डीन कार्यालय या छात्र संघ से पूछ सकते हैं। किताबें: पुस्तकालय। पूछने में झिझकें नहीं!","आपका वीज़ा और पंजीकरण के बारे में सवाल है। कहाँ जाएँगे?",["खेल परिसर","पुस्तकालय","अंतरराष्ट्रीय विभाग"],"वीज़ा और पंजीकरण के लिए अंतरराष्ट्रीय विभाग।"],
["खेल और दोस्त","УрГУПС का खेल परिसर और स्टेडियम कैंपस में है (पहले स्टेशन के नक्शे पर दिखाया गया है)। क्लब कक्षा के बाहर दोस्त बनाने का सबसे अच्छा तरीका है।","पढ़ाई के बाहर लोगों से कैसे मिलें?",["किसी क्लब या खेल-सेक्शन में शामिल हों","कमरे में बैठे रहें","इंतज़ार करें कि लोग खुद आएँ"],"साझा गतिविधियाँ लोगों को करीब लाती हैं।"]],
P:[["नमस्ते, मैं УрГУПС का छात्र/छात्रा हूँ।","क्या आप बता सकते हैं कि डीन कार्यालय कैसे पहुँचूँ?","अंतरराष्ट्रीय विभाग कहाँ है?"],["नमस्ते, [नाम और पितृनाम]!","माफ़ कीजिए, मुझे समझ नहीं आया। कृपया दोबारा कहें।","क्या मैं एक सवाल पूछ सकता/सकती हूँ?","बहुत-बहुत धन्यवाद!"],["मेरा नाम [नाम] है, मैं समूह [समूह] का छात्र/छात्रा हूँ।","छूटी हुई कक्षा की भरपाई कैसे कर सकता/सकती हूँ?","सादर, [नाम]"],["नमस्ते! मेरा नाम [नाम] है, और तुम्हारा?","मैं [देश] से हूँ। तुम कहाँ से हो?","क्या मैं यहाँ बैठ सकता/सकती हूँ?","चलो साथ मिलकर तैयारी करें?"],["नमस्ते, कमरा [नंबर] में [क्या] काम नहीं कर रहा।","चाबी लेने कब आ सकता/सकती हूँ?","शोर के लिए माफ़ कीजिए, हम धीरे बोलेंगे।"],["मुझे मदद चाहिए।","मैं विदेशी छात्र/छात्रा हूँ, कृपया बताइए क्या करूँ।","इस बारे में मैं किससे बात करूँ?"],["क्या मैं सेक्शन में शामिल हो सकता/सकती हूँ?","आपकी प्रैक्टिस कब होती है?","चलो साथ खेलते हैं!"]],
G:[["चेकपॉइंट: प्रवेश पर जहाँ आपका पास जाँचा जाता है","पास: वह दस्तावेज़ या कार्ड जिससे आप अंदर जा सकते हैं"],["कक्षा-काल (пара): विश्वविद्यालय में एक कक्षा, आमतौर पर डेढ़ घंटे की","सेमेस्टर के अंत की जाँच: зачёт में पास/फेल, экзамен में अंक मिलते हैं"],["भरपाई (отработка): छूटी कक्षा के बदले किया जाने वाला काम","उचित कारण: अनुपस्थिति का ठोस कारण, जैसे बीमारी (अक्सर प्रमाण-पत्र चाहिए)"],["समूह-प्रमुख (староста): वह छात्र जो समूह और डीन कार्यालय के बीच कड़ी है","समूह: साथ पढ़ने वाले छात्र"],["हॉस्टल प्रबंधक (комендант): हॉस्टल और मरम्मत का ज़िम्मेदार व्यक्ति","शांति के घंटे: वह समय जब शोर करना मना है"],["डीन कार्यालय: संकाय का दफ़्तर: समय-सारणी, प्रमाण-पत्र, दस्तावेज़","छात्र संघ: छात्रों के अधिकारों की रक्षा करता है और कार्यक्रम आयोजित करता है"],["सेक्शन: प्रशिक्षक के साथ खेल का समूह","खेल परिसर"]],
M:"नमस्ते, [नाम और पितृनाम]!\nमेरा नाम [नाम] है, मैं समूह [समूह] का छात्र/छात्रा हूँ और [देश] से आया/आई हूँ।\nमैं [तारीख] की कक्षा में नहीं आ सका/सकी: [कारण]।\nकृपया बताइए कि मैं इसकी भरपाई कैसे कर सकता/सकती हूँ?\nसादर,\n[नाम]"};

en:[["Мне надо пройти, не задавайте вопросов (I need to get through, no questions)","Здравствуйте, я студент УрГУПС, иду в деканат (Hello, I’m a student, going to the dean’s office)","Эй, пропустите, я очень спешу! (Hey, let me through, I’m in a big hurry!)"],["Привет, Иван! (Hi, Ivan!)","Эй, преподаватель! (Hey, teacher!)","Здравствуйте, Иван Петрович! (Hello, Ivan Petrovich!)"],["Привет! Меня зовут …, а тебя? (Hi! My name is …, what’s yours?)","Сколько ты зарабатываешь? (How much do you earn?)","Отстань, я сейчас занят. (Leave me alone, I’m busy right now.)"],["Холодно, сделайте что-нибудь, мне надоело мёрзнуть! (It’s cold, do something, I’m tired of freezing!)","Здравствуйте, в комнате 214 не работает отопление. Можно посмотреть? (Hello, the heating in room 214 isn’t working. Could you look?)","Ничего страшного, я потерплю, не беспокойтесь. (It’s okay, I’ll put up with it, don’t worry.)"]],

kk:[["Мне надо пройти, не задавайте вопросов (Маған өту керек, сұрақ қоймаңыздар)","Здравствуйте, я студент УрГУПС, иду в деканат (Сәлеметсіз бе, мен студентпін, деканатқа барамын)","Эй, пропустите, я очень спешу! (Әй, өткізіңдер, мен қатты асығып тұрмын!)"],["Привет, Иван! (Сәлем, Иван!)","Эй, преподаватель! (Әй, оқытушы!)","Здравствуйте, Иван Петрович! (Сәлеметсіз бе, Иван Петрович!)"],["Привет! Меня зовут …, а тебя? (Сәлем! Менің атым …, ал сенікі?)","Сколько ты зарабатываешь? (Сен қанша табасың?)","Отстань, я сейчас занят. (Қой, мен қазір бос емеспін.)"],["Холодно, сделайте что-нибудь, мне надоело мёрзнуть! (Суық, бірдеңе істеңіздер, тоңып шаршадым!)","Здравствуйте, в комнате 214 не работает отопление. Можно посмотреть? (Сәлеметсіз бе, 214 бөлмеде жылу жұмыс істемейді. Қарап шығуға бола ма?)","Ничего страшного, я потерплю, не беспокойтесь. (Ештеңе етпейді, шыдаймын, уайымдамаңыздар.)"]]};

en:[
[{q:"You forgot your student card at home and the guard asks for a document. What do you say?",o:["Мне всё равно, я пройду и так (I don’t care, I’ll get in anyway)","Здравствуйте, я забыл студенческий дома. Можно позвонить в деканат? (Hello, I forgot my student card at home. May I call the dean’s office?)","Студенческий не нужен, я же студент (I don’t need a card, I’m a student)"],c:1,e:"Explain the situation calmly and offer a solution."},{q:"How do you ask the way to the library?",o:["Эй, где тут библиотека? (Hey, where’s the library?)","Извините, как пройти в библиотеку? (Excuse me, how do I get to the library?)","Покажите мне, где библиотека! (Show me where the library is!)"],c:1,e:"“Excuse me” plus “how do I get to…” is the politest way."}],
[{q:"You didn’t understand the task. What is best to say to the teacher?",o:["Извините, можно объяснить ещё раз? (Excuse me, could you explain once more?)","Это непонятно, объясните нормально. (This is unclear, explain it properly.)","Я ничего не понял, и всё. (I understood nothing, that’s it.)"],c:0,e:"Politely asking to repeat is normal and right."},{q:"You are late for class. What do you say when you come in?",o:["Тихо сесть и ничего не говорить (Sit down quietly and say nothing)","Извините за опоздание. Можно войти? (Sorry for being late. May I come in?)","Я задержался, это не моя вина! (I was delayed, it’s not my fault!)"],c:1,e:"A short apology and asking to enter is proper etiquette."}],
[{q:"Which email subject is the clearest?",o:["Помогите!!! (Help!!!)","Вопрос по занятию 12 марта (группа …) (Question about the class on March 12, group …)","Привет, это я (Hi, it’s me)"],c:1,e:"The subject should explain right away what the email is about."},{q:"How is it best to end the email?",o:["С уважением, [Имя Фамилия] (Sincerely, [first and last name])","Ну всё, пока. (Well, bye.)","Жду ответа сегодня!!! (I expect an answer today!!!)"],c:0,e:"“Sincerely” and your name is the standard ending."}],
[{q:"How do you ask a classmate for their notes?",o:["Дай конспект, мне надо. (Give me the notes, I need them.)","Привет! Можно взять у тебя конспект? (Hi! May I borrow your notes?)","Конспект? Ты же его не используешь. (Notes? You’re not using them anyway.)"],c:1,e:"A polite request with “may I” beats a demand."},{q:"How do you politely turn down an invitation?",o:["Спасибо за приглашение, но я не смогу. (Thank you for the invitation, but I can’t come.)","Нет, мне это неинтересно. (No, I’m not interested.)","Я не пойду. Не спрашивай больше. (I’m not going. Don’t ask again.)"],c:0,e:"Thanking and declining honestly is polite."}],
[{q:"Neighbours are noisy at night. What do you say?",o:["Замолчите, вы мне мешаете! (Be quiet, you’re disturbing me!)","Мне всё равно, шумите дальше. (I don’t care, keep making noise.)","Извините, можно потише? Я хочу спать. (Excuse me, could you be quieter? I want to sleep.)"],c:2,e:"A request without rudeness works better."},{q:"You lost your room key. Who do you go to?",o:["The dean","The commandant","The library"],c:1,e:"Keys and everyday issues go to the commandant."}],
[{q:"Where do you get a certificate of study?",o:["Library","Dean’s office","Sports complex"],c:1,e:"The dean’s office issues certificates of study."},{q:"What is the “профком” (student union)?",o:["The university canteen where you can have lunch","The guards who check passes at the entrance","The student union: it protects students’ rights"],c:2,e:"The profkom is the student union: it protects students’ rights and organizes events."}],
[{q:"How do you find out when practices are?",o:["Когда у вас тренировки? (When do you have practice?)","Скажи мне расписание сейчас. (Tell me the schedule now.)","Тренировки когда? Не знаю. (Practice when? I don’t know.)"],c:0,e:"A direct, polite question is the best way."},{q:"How do you invite a new acquaintance to go together?",o:["Ты пойдёшь со мной или нет? (Are you coming with me or not?)","Давай сходим вместе? (Shall we go together?)","Мне нужно, чтобы ты пошёл. (I need you to go.)"],c:1,e:"“Shall we go together?” sounds friendly."}]]};
