zh:{S:[
["进入校园","进入学生城有两个检查口：1号检查口在街道一侧，紧挨УрГУПС体育场；2号检查口在西南侧，靠近水边。请随身带好通行证或学生证。","门口的保安问你要去哪里，说什么最合适？",["哪儿也不去","Здравствуйте, я студент УрГУПС, иду в деканат（您好，我是学生，去院系办公室）","喂，让我进去！"],"礼貌、简明，最有效。"],
["和老师交流","在俄罗斯，学生对老师要用敬称“вы”，并称呼名字和父称，例如“Иван Петрович”。没听懂也没关系，请老师再说一遍。","怎样问候老师？",["嗨，伊万！","喂，老师！","Здравствуйте, Иван Петрович!（您好，伊万·彼得罗维奇！）"],"称呼名字和父称表示尊重。"],
["给老师写邮件","缺课或需要帮助？写一封简短礼貌的邮件：你是谁、哪个班、发生了什么、你的请求。下面有现成模板，复制后填上你的信息。","邮件里必须写什么？",["只写“帮帮我”","姓名、班级和请求内容","什么都不写，老师会明白"],"这样老师能很快知道你是谁、该如何帮你。"],
["认识同学","别怕先开口：很多同学乐于结识你。请班长（староста）把你拉进班级群，课表和作业都在那里分享。","怎样和同学开始聊天？",["Привет! Меня зовут …, а тебя?（你好！我叫……，你呢？）","默默坐在旁边","问对方挣多少钱"],"简单的“我叫……，你呢？”是最好的开场。"],
["宿舍生活","宿舍有规定和安静时间。东西坏了或需要帮助，请找宿舍管理员（комендант）。如果有客人来或要晚睡吵闹，请提前告诉室友。","房间暖气坏了，怎么对宿管说？",["好冷，你们想想办法！","Здравствуйте, в комнате 214 не работает отопление. Можно посмотреть?（您好，214房间暖气坏了，能来看看吗？）","没事，我忍一忍"],"说清房间号和问题，会更快得到帮助。"],
["遇到问题找谁","签证和证件：国际部。课表、证明和缺课：院系办公室。经济资助和活动：学生工会。借书：图书馆。别不好意思开口问！","你有关于签证和注册的问题，该去哪里？",["体育综合馆","图书馆","国际部"],"签证和注册找国际部。"],
["运动与朋友","УрГУПС体育综合馆和体育场在校园内（在第一站的地图上有标注）。参加社团是课外交朋友的最好方式。","怎样在学习之外认识人？",["加入社团或体育小组","待在房间里","等别人来找你"],"共同的活动让人走近。"]],
P:[["您好，我是УрГУПС的学生。","请问去院系办公室怎么走？","国际部在哪里？"],["您好，[名字和父称]！","对不起，我没听懂，请再说一遍。","我可以提个问题吗？","非常感谢！"],["我叫[名字]，是[班级]班的学生。","请问我怎样补上缺的那节课？","此致敬礼，[姓名]"],["你好！我叫[名字]，你呢？","我来自[国家]，你是哪里人？","我可以坐这里吗？","我们一起复习好吗？"],["您好，[房间号]房间的[什么]坏了。","什么时候可以来拿钥匙？","对不起吵到了，我们会小声点。"],["我需要帮助。","我是留学生，请告诉我该怎么做。","这件事我该找谁？"],["我可以报名参加社团吗？","你们什么时候训练？","我们一起玩吧！"]],
G:[["检查口：入口处检查通行证的地方","通行证：能让你进入的证件或卡片"],["课时：大学里的一节课，通常一个半小时","期末考核：зачёт只记“通过”，экзамен给出分数"],["补做：为缺的课补交的作业","正当理由：缺课的正当原因，如生病（常需证明）"],["班长：联系班级和院系办公室的学生","班级：一起学习的学生"],["宿舍管理员：负责宿舍和维修的人","安静时间：不允许吵闹的时间"],["院系办公室：课表、证明、文件","学生工会：学生援助和活动"],["社团：有教练的运动小组","体育综合馆"]],
M:"您好，[名字和父称]！\n我叫[名字]，是[班级]班的学生，来自[国家]。\n我没能参加[日期]的课：[原因]。\n请问我怎样补上？\n此致敬礼，\n[姓名]"},
fr:{S:[
["Entrée du campus","On entre sur le campus par deux postes de contrôle : le n° 1 côté rue, à côté du stade de l’UrGUPS, et le n° 2 au bord de l’eau, au sud-ouest. Garde ton badge ou ta carte d’étudiant à portée de main.","Le garde à l’entrée te demande où tu vas. Que dire ?",["Nulle part","Здравствуйте, я студент УрГУПС, иду в деканат (Bonjour, je suis étudiant, je vais au secrétariat)","Eh, laissez-moi passer !"],"Poli et direct : c’est le plus efficace."],
["Parler aux professeurs","En Russie, on s’adresse aux professeurs avec « вы » et par prénom et patronyme, par exemple « Ivan Petrovitch ». Si tu n’as pas compris, ce n’est pas grave : demande de répéter.","Comment saluer un professeur ?",["Salut, Ivan !","Eh, prof !","Здравствуйте, Иван Петрович ! (Bonjour, Ivan Petrovitch !)"],"Prénom et patronyme montrent du respect."],
["Écrire à un professeur","Tu as manqué un cours ou besoin d’aide ? Écris un message court et poli : qui tu es, ton groupe, ce qui s’est passé et ta demande. Voici un modèle : copie-le et complète-le.","Que faut-il indiquer dans le message ?",["Juste « Aidez-moi »","Ton nom, ton groupe et ta demande","Rien, le professeur comprendra"],"Ainsi le professeur comprend vite qui tu es et comment t’aider."],
["Rencontrer ses camarades","N’aie pas peur de parler le premier : beaucoup d’étudiants seront heureux de te rencontrer. Demande au délégué (староста) de t’ajouter au groupe de discussion, où l’on partage emploi du temps et devoirs.","Comment engager la conversation avec un camarade ?",["Привет! Меня зовут …, а тебя? (Salut ! Je m’appelle …, et toi ?)","S’asseoir en silence à côté de lui","Lui demander combien il gagne"],"Un simple « je m’appelle… et toi ? » est le meilleur début."],
["Vie en résidence","La résidence a un règlement et des heures de silence. Si quelque chose casse ou si tu as besoin d’aide, va voir le gestionnaire (комендант). Préviens tes colocataires si tu attends des invités ou fais du bruit tard.","Le chauffage de ta chambre ne marche pas. Que dis-tu au gestionnaire ?",["Il fait froid, faites quelque chose !","Здравствуйте, в комнате 214 не работает отопление. Можно посмотреть? (Bonjour, le chauffage de la chambre 214 ne marche pas. Pouvez-vous regarder ?)","Rien, je vais supporter"],"Donne le numéro de chambre et le problème : on t’aidera plus vite."],
["Qui demander de l’aide","Visa et documents : service international. Emploi du temps, attestations et absences : secrétariat de faculté. Aides financières et événements : syndicat étudiant. Livres : bibliothèque. N’hésite pas à demander !","Tu as une question sur ton visa et ton enregistrement. Où aller ?",["Complexe sportif","Bibliothèque","Service international"],"Visa et enregistrement : service international."],
["Sport et amis","Le complexe sportif et le stade de l’UrGUPS sont sur le campus (indiqués sur le plan de la première station). Les clubs sont le meilleur moyen de se faire des amis hors des cours.","Comment rencontrer des gens en dehors des études ?",["Rejoindre un club ou une section sportive","Rester dans sa chambre","Attendre que les gens viennent"],"Les activités communes rapprochent."]],
P:[["Bonjour, je suis étudiant à l’UrGUPS.","Pourriez-vous m’indiquer le chemin du secrétariat ?","Où se trouve le service international ?"],["Bonjour, [prénom et patronyme] !","Désolé, je n’ai pas compris. Répétez, s’il vous plaît.","Puis-je poser une question ?","Merci beaucoup !"],["Je m’appelle [nom], je suis étudiant(e) du groupe [groupe].","Comment puis-je rattraper le cours manqué ?","Cordialement, [nom]"],["Salut ! Je m’appelle [nom], et toi ?","Je viens de [pays]. Et toi ?","Je peux m’asseoir ici ?","On révise ensemble ?"],["Bonjour, dans la chambre [numéro], [quoi] ne marche pas.","Quand puis-je venir chercher la clé ?","Désolé pour le bruit, on fera moins de bruit."],["J’ai besoin d’aide.","Je suis étudiant international, dites-moi quoi faire.","À qui dois-je m’adresser pour cela ?"],["Je peux m’inscrire au club ?","Quand avez-vous entraînement ?","Jouons ensemble !"]],
G:[["poste de contrôle : l’endroit où l’on vérifie ton badge à l’entrée","badge : document ou carte qui permet d’entrer"],["période de cours à l’université, en général 1 h 30","contrôles de fin de semestre : зачёт = validé ou non, экзамен = note"],["travail de rattrapage pour un cours manqué","motif valable d’absence, comme la maladie (un certificat est souvent demandé)"],["le délégué qui fait le lien entre le groupe et le secrétariat","groupe d’étudiants qui étudient ensemble"],["la personne responsable de la résidence et des réparations","heures de silence : le bruit est interdit"],["bureau de la faculté : emploi du temps, attestations, documents","syndicat étudiant : aides et événements"],["club sportif avec un entraîneur","complexe sportif"]],
M:"Bonjour, [prénom et patronyme] !\nJe m’appelle [nom], je suis étudiant(e) du groupe [groupe], de [pays].\nJe n’ai pas pu assister au cours du [date] : [raison].\nComment puis-je le rattraper ?\nCordialement,\n[nom]"},
kk:{S:[
["Кампусқа кіру","Студенттер қалашығына екі бақылау-өткізу пунктінен кіруге болады: № 1 — көшенің жағында, УрГУПС стадионының қасында, № 2 — оңтүстік-батыста, су жағасында. Рұқсатнама немесе студенттік билетті қолыңда ұста.","Кіреберістегі күзетші қайда бара жатқаныңды сұрады. Не айтқан дұрыс?",["Ешқайда","Здравствуйте, я студент УрГУПС, иду в деканат (Сәлеметсіз бе, мен студентпін, деканатқа барамын)","Әй, өткізіңдер!"],"Сыпайы әрі нақты айту — ең тиімдісі."],
["Оқытушымен сөйлесу","Ресейде оқытушыға «вы» деп, аты мен әкесінің атымен жүгінеді, мысалы «Иван Петрович». Түсінбесең — қорықпа, қайталауын сұра.","Оқытушымен қалай амандасады?",["Сәлем, Иван!","Әй, оқытушы!","Здравствуйте, Иван Петрович! (Сәлеметсіз бе, Иван Петрович!)"],"Аты мен әкесінің аты — құрметтің белгісі."],
["Оқытушыға хат жазу","Сабақты жіберіп алдың немесе көмек керек пе? Қысқа әрі сыпайы жаз: кімсің, қай топтансың, не болды және не сұрайсың. Төменде дайын үлгі бар: көшіріп, деректеріңді қой.","Хатта міндетті түрде не көрсетілуі керек?",["Тек «Көмектесіңіз»","Аты-жөнің, тобың және өтінішің","Ештеңе, оқытушы түсінеді"],"Сонда оқытушы кім екеніңді және қалай көмектесерін тез түсінеді."],
["Топтастармен танысу","Бірінші болып сөйлесуден қорықпа: көптеген студент танысуға қуанады. Старостадан сені топ чатына қосуын сұра: кесте мен тапсырмалар сонда бөлісіледі.","Топтасыңмен әңгімені қалай бастайсың?",["Привет! Меня зовут …, а тебя? (Сәлем! Менің атым …, ал сенікі?)","Үндемей қасына отыру","Қанша табатынын сұрау"],"Қарапайым «менің атым… ал сенікі?» — ең жақсы бастама."],
["Жатақхана өмірі","Жатақханада ережелер мен тыныштық уақыты бар. Бірдеңе бұзылса немесе көмек керек болса — комендантқа бар. Қонақ күтсең немесе кеш дыбыс шығарсаң, бөлмелестеріңе ескерт.","Бөлмеде жылу жұмыс істемейді. Комендантқа не дейсің?",["Суық, бірдеңе істеңіздер!","Здравствуйте, в комнате 214 не работает отопление. Можно посмотреть? (Сәлеметсіз бе, 214 бөлмеде жылу жұмыс істемейді. Қарап шығуға бола ма?)","Ештеңе, шыдай тұрамын"],"Бөлме нөмірі мен мәселені айт — тезірек көмектеседі."],
["Кімнен көмек сұрау керек","Виза және құжаттар — халықаралық бөлім. Кесте, анықтамалар және сабақ жіберу — деканат. Материалдық көмек және іс-шаралар — профком. Кітаптар — кітапхана. Сұрауға ұялма!","Виза мен тіркеу бойынша сұрағың бар. Қайда барасың?",["Спорт кешеніне","Кітапханаға","Халықаралық бөлімге"],"Виза мен тіркеу — халықаралық бөлім."],
["Спорт және достар","СК УрГУПС — кампустағы стадион мен спорт кешені (бірінші бекеттегі картада белгіленген). Секциялар — оқудан тыс дос табудың ең жақсы жолы.","Оқудан тыс адамдармен қалай танысасың?",["Секцияға немесе клубқа жазылу","Бөлмеде отыру","Адамдар өздері келгенше күту"],"Ортақ іс адамдарды жақындатады."]],
P:[["Сәлеметсіз бе, мен УрГУПС студентімін.","Деканатқа қалай баруға болатынын айтып жіберіңізші?","Халықаралық бөлім қайда орналасқан?"],["Сәлеметсіз бе, [аты мен әкесінің аты]!","Кешіріңіз, түсінбедім. Қайталап беріңізші.","Сұрақ қоюға бола ма?","Көп рахмет!"],["Менің атым [аты], мен [топ] тобының студентімін.","Жіберіп алған сабақты қалай өтеуге болады?","Құрметпен, [аты-жөні]"],["Сәлем! Менің атым [аты], ал сенікі?","Мен [ел] елінденмін. Ал сен қайдансың?","Осында отыруға бола ма?","Бірге дайындалайық па?"],["Сәлеметсіз бе, [нөмір] бөлмеде [не] жұмыс істемейді.","Кілтті қашан алуға келуге болады?","Шу үшін кешіріңіз, тыныш боламыз."],["Маған көмек керек.","Мен шетелдік студентпін, не істеу керегін айтыңызшы.","Бұл мәселе бойынша кімге жүгінемін?"],["Секцияға жазылуға бола ма?","Жаттығулар қашан?","Бірге ойнайық!"]],
G:[["бақылау-өткізу пункті: кіреберісте рұқсатнаманы тексеретін жер","рұқсатнама: кіруге мүмкіндік беретін құжат немесе карта"],["пара: университеттегі бір сабақ, әдетте бір жарым сағат","семестр соңындағы тексеру: зачёт — «өтті/өтпеді», экзамен — баға қояды"],["өтеу: жіберілген сабақ үшін орындалатын тапсырма","дәлелді себеп: сабақ жіберудің маңызды себебі, мысалы ауру (көбіне анықтама керек)"],["староста: топ пен деканатты байланыстыратын студент","топ: бірге оқитын студенттер"],["комендант: жатақхана мен жөндеуге жауапты адам","тыныштық уақыты: шуылдауға болмайтын уақыт"],["деканат: факультет кеңсесі — кесте, анықтамалар, құжаттар","профком: студенттер кәсіподағы — көмек пен іс-шаралар"],["секция: жаттықтырушысы бар спорт тобы","спорт кешені"]],
M:"Сәлеметсіз бе, [аты мен әкесінің аты]!\nМенің атым [аты], мен [топ] тобының студентімін, [ел] елінденмін.\nМен [күні] сабаққа келе алмадым: [себеп].\nЖіберіп алғанымды қалай өтеуге болады?\nҚұрметпен,\n[аты-жөні]"}};

ru:[["Мне надо пройти, не задавайте вопросов","Здравствуйте, я студент УрГУПС, иду в деканат","Эй, пропустите, я очень спешу!"],["Привет, Иван!","Эй, преподаватель!","Здравствуйте, Иван Петрович!"],["Привет! Меня зовут …, а тебя?","Сколько ты зарабатываешь?","Отстань, я сейчас занят."],["Холодно, сделайте что-нибудь, мне надоело мёрзнуть!","Здравствуйте, в комнате 214 не работает отопление. Можно посмотреть?","Ничего страшного, я потерплю, не беспокойтесь."]],
en:[["Мне надо пройти, не задавайте вопросов (I need to get through, no questions)","Здравствуйте, я студент УрГУПС, иду в деканат (Hello, I’m a student, going to the dean’s office)","Эй, пропустите, я очень спешу! (Hey, let me through, I’m in a big hurry!)"],["Привет, Иван! (Hi, Ivan!)","Эй, преподаватель! (Hey, teacher!)","Здравствуйте, Иван Петрович! (Hello, Ivan Petrovich!)"],["Привет! Меня зовут …, а тебя? (Hi! My name is …, what’s yours?)","Сколько ты зарабатываешь? (How much do you earn?)","Отстань, я сейчас занят. (Leave me alone, I’m busy right now.)"],["Холодно, сделайте что-нибудь, мне надоело мёрзнуть! (It’s cold, do something, I’m tired of freezing!)","Здравствуйте, в комнате 214 не работает отопление. Можно посмотреть? (Hello, the heating in room 214 isn’t working. Could you look?)","Ничего страшного, я потерплю, не беспокойтесь. (It’s okay, I’ll put up with it, don’t worry.)"]],
zh:[["Мне надо пройти, не задавайте вопросов（我得过去，别问问题）","Здравствуйте, я студент УрГУПС, иду в деканат（您好，我是学生，去院系办公室）","Эй, пропустите, я очень спешу!（喂，让我过去，我很急！）"],["Привет, Иван!（嗨，伊万！）","Эй, преподаватель!（喂，老师！）","Здравствуйте, Иван Петрович!（您好，伊万·彼得罗维奇！）"],["Привет! Меня зовут …, а тебя?（你好！我叫……，你呢？）","Сколько ты зарабатываешь?（你挣多少钱？）","Отстань, я сейчас занят.（别烦我，我现在很忙。）"],["Холодно, сделайте что-нибудь, мне надоело мёрзнуть!（好冷，想想办法，我受够了！）","Здравствуйте, в комнате 214 не работает отопление. Можно посмотреть?（您好，214房间暖气坏了，能来看看吗？）","Ничего страшного, я потерплю, не беспокойтесь.（没关系，我忍一忍，别担心。）"]],
fr:[["Мне надо пройти, не задавайте вопросов (Je dois passer, pas de questions)","Здравствуйте, я студент УрГУПС, иду в деканат (Bonjour, je suis étudiant, je vais au secrétariat)","Эй, пропустите, я очень спешу! (Eh, laissez-moi passer, je suis très pressé !)"],["Привет, Иван! (Salut, Ivan !)","Эй, преподаватель! (Eh, prof !)","Здравствуйте, Иван Петрович! (Bonjour, Ivan Petrovitch !)"],["Привет! Меня зовут …, а тебя? (Salut ! Je m’appelle …, et toi ?)","Сколько ты зарабатываешь? (Tu gagnes combien ?)","Отстань, я сейчас занят. (Laisse-moi, je suis occupé.)"],["Холодно, сделайте что-нибудь, мне надоело мёрзнуть! (Il fait froid, faites quelque chose, j’en ai marre !)","Здравствуйте, в комнате 214 не работает отопление. Можно посмотреть? (Bonjour, le chauffage de la chambre 214 ne marche pas. Pouvez-vous regarder ?)","Ничего страшного, я потерплю, не беспокойтесь. (Ce n’est pas grave, je vais supporter, ne vous inquiétez pas.)"]],
kk:[["Мне надо пройти, не задавайте вопросов (Маған өту керек, сұрақ қоймаңыздар)","Здравствуйте, я студент УрГУПС, иду в деканат (Сәлеметсіз бе, мен студентпін, деканатқа барамын)","Эй, пропустите, я очень спешу! (Әй, өткізіңдер, мен қатты асығып тұрмын!)"],["Привет, Иван! (Сәлем, Иван!)","Эй, преподаватель! (Әй, оқытушы!)","Здравствуйте, Иван Петрович! (Сәлеметсіз бе, Иван Петрович!)"],["Привет! Меня зовут …, а тебя? (Сәлем! Менің атым …, ал сенікі?)","Сколько ты зарабатываешь? (Сен қанша табасың?)","Отстань, я сейчас занят. (Қой, мен қазір бос емеспін.)"],["Холодно, сделайте что-нибудь, мне надоело мёрзнуть! (Суық, бірдеңе істеңіздер, тоңып шаршадым!)","Здравствуйте, в комнате 214 не работает отопление. Можно посмотреть? (Сәлеметсіз бе, 214 бөлмеде жылу жұмыс істемейді. Қарап шығуға бола ма?)","Ничего страшного, я потерплю, не беспокойтесь. (Ештеңе етпейді, шыдаймын, уайымдамаңыздар.)"]]};
